# ==============================================
# DualShock4 mapping reference for ros2 joy node
# ==============================================
#
# [buttons]                   [axes]
# +-----------+--------+      +-------------------+--------+
# |   name    | index  |      |       name        | index  | 
# +-----------+--------+      +-------------------+--------+
# | cross     |    0   |      | left horizontal   |    0   |
# | circle    |    1   |      | left vertical     |    1   |
# | square    |    2   |      | right horizontal  |    2   |
# | triangle  |    3   |      | right vertical    |    3   |
# | share     |    4   |      | L2 analog         |    4   |
# | ps        |    5   |      | R2 analog         |    5   |
# | options   |    6   |      +-------------------+--------+
# | L3        |    7   |
# | R3        |    8   |
# | L1        |    9   |
# | R1        |   10   |
# | up        |   11   |
# | down      |   12   |
# | left      |   13   |
# | right     |   14   |
# | touch pad |   15   |
# +-----------+--------+

ds4_teleop_node:
  ros__parameters:
    device_path: "/dev/dualshock4"
    stamped: true
    base_frame_id: "base_footprint"

    slow_button: -1   # unused
    normal_button: 9
    turbo_button: 10
    axes_linear: 1
    axes_angular: 2

    scale_linear_slow: 0.0
    scale_angular_slow: 0.0
    scale_linear: 0.4
    scale_angular: 1.0
    scale_linear_turbo: 0.7
    scale_angular_turbo: 2.0

    feedback:
      enabled: true
      rumble_weak_multiplier: 1.0
      rumble_strong_multiplier: 1.0
      flush_bright_cycle: 0.5
      flush_dark_cycle: 0.5
